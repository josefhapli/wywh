<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Checkout | Wish You Were Here</title>
    <link rel="stylesheet" href="css/app.css">
  </head>
  <body class="app-shell" data-page="create">
    <header class="site-header">
      <div class="header-inner">
        <a class="brand" href="index.html"><span class="brand-mark">WY</span><span>Wish You Were Here</span></a>
        <nav class="nav-links" aria-label="Primary">
          <a href="index.html">Home</a>
          <a class="active" href="create.html">Create</a>
          <a href="orders.html">Orders</a>
          <a href="login.html">Login</a>
        </nav>
      </div>
    </header>

    <main class="app-main">
      <div class="container">
        <div class="page-heading">
          <div>
            <h1>Checkout</h1>
            <p>This MVP simulates payment and creates a queued print order.</p>
          </div>
        </div>
        <div class="workspace">
          <article class="postcard front"><img data-preview-image alt="Postcard front"></article>
          <aside class="summary">
            <h2>Order Summary</h2>
            <div class="summary-row"><span>1 Postcard</span><strong>$2.99</strong></div>
            <div class="summary-row"><span>Shipping</span><strong>Included</strong></div>
            <div class="summary-row total"><span>Total</span><span>$2.99</span></div>
            <button class="btn primary full" id="checkout" type="button">Pay Now</button>
            <p class="notice">Stripe can replace this simulated button when the backend is ready.</p>
          </aside>
        </div>
      </div>
    </main>

    <nav class="mobile-nav" aria-label="Mobile">
      <a data-nav="home" href="index.html">Home</a>
      <a data-nav="create" href="create.html">Create</a>
      <a data-nav="orders" href="orders.html">Orders</a>
      <a data-nav="me" href="login.html">Me</a>
    </nav>
    <script type="module" src="js/checkout.js"></script>
  </body>
</html>
