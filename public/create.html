<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/png" href="images/WYWH-icon-color.png">
    <title>Create | Wish You Were Here</title>
    <link rel="stylesheet" href="css/app.css?v=20260731-white-header">
  </head>
  <body class="app-shell" data-page="create">
    <header class="site-header">
      <div class="header-inner">
        <a class="brand" href="index.html" aria-label="Wish You Were Here home"><img class="brand-logo" src="images/WYWH-logo-color-transparent.png" alt=""></a>
        <nav class="nav-links" aria-label="Primary">
          <a href="index.html">Home</a>
          <a class="active" href="create.html">Create</a>
          <a href="orders.html">Orders</a>
          <a href="login.html">Login</a>
        </nav>
      </div>
    </header>

    <main class="app-main">
      <div class="container">
        <div class="page-heading">
          <div>
            <h1>Create postcard</h1>
            <p>Start with the photo. This will become the front of the card.</p>
          </div>
        </div>
        <div class="workspace">
          <section class="upload-card" aria-label="Upload postcard photo">
            <input id="photoUpload" type="file" accept="image/*">
            <label class="upload-label" for="photoUpload">
              <span class="upload-icon">+</span>
              <strong>Upload Front Photo</strong>
              <span>Choose an image or drop one here.</span>
            </label>
            <p class="notice" id="uploadStatus" aria-live="polite"></p>
          </section>
          <aside>
            <div class="preview-frame">
              <img data-preview-image alt="Postcard front preview">
            </div>
            <div class="section compact">
              <a class="btn primary full" data-continue href="message.html">Continue</a>
            </div>
          </aside>
        </div>
      </div>
    </main>

    <footer class="site-footer"><div class="container footer-inner"><span>&copy; 2026 Wish You Were Here, made with love <span class="footer-heart" aria-label="love">♥</span> by EtherStudios.</span><a href="terms.html">Terms &amp; Conditions</a></div></footer>
    <nav class="mobile-nav" aria-label="Mobile">
      <a data-nav="home" href="index.html">Home</a>
      <a data-nav="create" href="create.html">Create</a>
      <a data-nav="orders" href="orders.html">Orders</a>
      <a data-nav="me" href="login.html">Me</a>
    </nav>
    <script type="module" src="js/upload.js?v=20260816-orientation"></script>
  </body>
</html>
